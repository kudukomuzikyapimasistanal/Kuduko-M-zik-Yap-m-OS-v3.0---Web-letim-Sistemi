<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kuduko OS</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      --bg: #0a0a12;
      --fg: #e8e8f0;
      --mut: #8b8ba0;
      --acc: #3b82f6;
      --gl: rgba(18, 18, 28, .86);
      --bd: rgba(255, 255, 255, .12);
      --tbh: calc(44px + env(safe-area-inset-bottom, 0px))
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 14px 'Inter', system-ui, sans-serif
    }

    #login {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 10%, #1e3a8a, transparent 50%), radial-gradient(circle at 85% 90%, #6b21a8, transparent 50%), #07070d
    }

    #lf {
      background: var(--gl);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 32px;
      width: min(340px, 88vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center
    }

    #lf h1 {
      margin: 0;
      font-size: 28px
    }

    #err {
      color: #f87171;
      min-height: 18px;
      font-size: 12px
    }

    #os {
      position: fixed;
      inset: 0;
      display: none
    }

    #desk {
      position: absolute;
      inset: 0 0 var(--tbh) 0;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, 88px);
      grid-auto-rows: 96px;
      align-content: start;
      background: linear-gradient(135deg, #0f172a, #312e81)
    }

    .ic {
      text-align: center;
      padding: 6px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      font-size: 11px
    }

    .ic:hover {
      background: #ffffff1f
    }

    .ic b {
      display: block;
      font-size: 30px;
      font-weight: 400
    }

    #wins {
      position: absolute;
      inset: 0 0 var(--tbh) 0;
      pointer-events: none
    }

    .win {
      pointer-events: auto;
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--gl);
      backdrop-filter: blur(14px);
      border: 1px solid var(--bd);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px #0009;
      resize: both;
      min-width: 260px;
      min-height: 160px;
      max-width: 100vw
    }

    .win.mx {
      inset: 0 !important;
      width: auto !important;
      height: auto !important;
      border-radius: 0;
      resize: none
    }

    .hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #ffffff14;
      cursor: move;
      touch-action: none;
      user-select: none
    }

    .hd button {
      background: none;
      border: 0;
      color: var(--mut);
      padding: 2px 7px
    }

    .hd button:hover {
      color: #fff;
      background: none
    }

    .bd {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    .row {
      display: flex;
      gap: 6px;
      padding: 6px;
      align-items: center;
      flex-wrap: wrap
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
      color: var(--fg);
      background: #ffffff14;
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 6px 10px
    }

    button {
      cursor: pointer
    }

    button:hover {
      background: #ffffff2a
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--acc)
    }

    .ta {
      flex: 1;
      resize: none;
      font-family: monospace;
      border: 0;
      border-radius: 0;
      background: transparent
    }

    #tb {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--tbh);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 6px;
      padding-right: 10px;
      background: var(--gl);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--bd);
      z-index: 99999
    }

    #tw {
      flex: 1;
      display: flex;
      gap: 4px;
      overflow-x: auto
    }

    #tw button {
      white-space: nowrap
    }

    #tw .on {
      background: #ffffff33;
      border-bottom: 2px solid var(--acc)
    }

    #sm {
      position: fixed;
      left: 8px;
      bottom: calc(var(--tbh) + 6px);
      width: min(360px, 94vw);
      max-height: 70vh;
      background: var(--gl);
      backdrop-filter: blur(14px);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 99998
    }

    #sm.on {
      display: flex
    }

    #sg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      overflow: auto
    }

    #sg button {
      border: 0;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px
    }

    #sg button b {
      font-size: 24px;
      font-weight: 400
    }

    .g {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px
    }

    .g button {
      padding: 14px 0;
      font-size: 16px
    }

    .disp {
      margin: 8px;
      font-size: 28px;
      text-align: right
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 8px;
      text-align: center
    }

    .cal .t {
      background: var(--acc);
      border-radius: 8px
    }

    .k {
      display: flex;
      gap: 3px;
      padding: 10px;
      flex-wrap: wrap
    }

    .k button {
      width: 44px;
      height: 140px;
      background: #f4f4f8;
      color: #111;
      align-self: flex-start
    }

    .k button.bk {
      background: #222;
      color: #fff;
      height: 90px
    }

    .m {
      padding: 8px;
      overflow: auto
    }

    .mut {
      color: var(--mut);
      font-size: 12px;
      padding: 4px 8px
    }

    .msg {
      padding: 6px 10px;
      margin: 4px 8px;
      border-radius: 10px;
      max-width: 80%;
      background: #ffffff1a;
      white-space: pre-wrap
    }

    .msg.u {
      align-self: flex-end;
      background: #2563eb
    }

    .si {
      width: 1.1em;
      height: 1.1em;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -.18em
    }

    .tl {
      display: inline-grid;
      place-items: center;
      width: 1.5em;
      height: 1.5em;
      border-radius: .45em;
      vertical-align: middle;
      color: #fff
    }

    .tl svg {
      width: 62%;
      height: 62%;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ic b,
    #sg b {
      font-size: inherit;
      font-weight: 400;
      margin-bottom: 4px
    }

    .ic b .tl,
    #sg b .tl {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      box-shadow: 0 6px 16px #0006
    }

    #sb .si {
      width: 20px;
      height: 20px
    }

    #mp {
      display: none;
      align-items: center;
      gap: 4px
    }

    #mp button {
      padding: 3px 8px;
      font-size: 12px
    }

    .pl .row:hover {
      background: #ffffff14
    }

    .pl .cur {
      background: #3b82f633
    }

    input[type=range] {
      accent-color: var(--acc)
    }
  </style>
</head>

<body>
  <div id="login">
    <form id="lf">
      <h1>🎧 Kuduko OS</h1>
      <div style="color:var(--mut)">Çalışma alanınıza giriş yapın</div>
      <input id="lu" placeholder="Kullanıcı adı" autocomplete="off"><input id="lp" type="password" placeholder="Şifre">
      <button style="background:var(--acc);border:0">Giriş yap</button>
      <div id="err"></div>
    </form>
  </div>
  <div id="os">
    <div id="desk"></div>
    <div id="wins"></div>
    <div id="sm"><input id="sq" placeholder="Uygulama ara...">
      <div id="sg"></div><button id="lo">⏻ Oturumu kapat</button>
    </div>
    <div id="tb"><button id="sb" title="Başlat"></button>
      <div id="tw"></div><span id="mp"><span id="mn" class="mut" style="max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer"></span><button data-mp="b">‹</button><button data-mp="p">▶</button><button data-mp="n">›</button></span><span id="net"></span><span id="clk"></span>
    </div>
  </div>
  <script>
    const $ = (s, e = document) => e.querySelector(s),
      esc = s => String(s).replace(/[&<>"]/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      } [c]));
    const S = {
      g: (k, d) => {
        try {
          const v = localStorage.getItem('kos_' + k);
          return v == null ? d : JSON.parse(v)
        } catch {
          return d
        }
      },
      s: (k, v) => {
        try {
          localStorage.setItem('kos_' + k, JSON.stringify(v))
        } catch {}
      }
    };
    const ev = v => {
      if (!/^[\d+\-*\/().% ]+$/.test(v)) throw 0;
      return +Function('"use strict";return(' + v + ')')().toFixed(10)
    };
    const WP = ['linear-gradient(135deg,#0f172a,#312e81)', 'linear-gradient(135deg,#064e3b,#0f172a)', 'linear-gradient(135deg,#7f1d1d,#1e1b4b)', 'radial-gradient(circle at 30% 20%,#0ea5e9,#0f172a 70%)', 'linear-gradient(160deg,#111827,#000)'];
    const MON = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
    const A = {};
    A.notepad = {
      t: 'Not Defteri',
      i: '📝',
      w: 620,
      h: 420,
      run(b) {
        let n = S.g('notes', {});
        b.innerHTML = '<div class=row><select class=ns></select><input class=nm placeholder="Başlık"><button class=sv>Kaydet</button><button class=nw>Yeni</button><button class=dl>Sil</button></div><textarea class=ta placeholder="Yazmaya başlayın... (Ctrl+S kaydeder)"></textarea>';
        const sel = $('.ns', b),
          nm = $('.nm', b),
          ta = $('.ta', b),
          ls = () => {
            sel.innerHTML = '<option value="">— notlar —</option>' + Object.keys(n).map(k => `<option>${esc(k)}</option>`).join('')
          };
        ls();
        const sv = () => {
          n = S.g('notes', {});
          if (!nm.value.trim()) nm.value = 'Not ' + (Object.keys(n).length + 1);
          n[nm.value] = ta.value;
          S.s('notes', n);
          ls();
          sel.value = nm.value
        };
        sel.onchange = () => {
          n = S.g('notes', {});
          nm.value = sel.value;
          ta.value = n[sel.value] || ''
        };
        $('.sv', b).onclick = sv;
        $('.nw', b).onclick = () => {
          nm.value = ta.value = '';
          sel.value = ''
        };
        $('.dl', b).onclick = () => {
          n = S.g('notes', {});
          delete n[nm.value];
          S.s('notes', n);
          ls();
          nm.value = ta.value = ''
        };
        ta.onkeydown = e => {
          if (e.ctrlKey && e.key == 's') {
            e.preventDefault();
            sv()
          }
        }
      }
    };
    A.calc = {
      t: 'Hesap Makinesi',
      i: '🧮',
      w: 320,
      h: 460,
      run(b) {
        b.innerHTML = '<input class=disp readonly value=0><div class=g></div>';
        const d = $('.disp', b),
          g = $('.g', b);
        'C ( ) / 7 8 9 * 4 5 6 - 1 2 3 + 0 . ⌫ ='.split(' ').forEach(k => {
          const x = document.createElement('button');
          x.textContent = k;
          x.onclick = () => {
            if (k == 'C') d.value = '0';
            else if (k == '⌫') d.value = d.value.slice(0, -1) || '0';
            else if (k == '=') {
              try {
                d.value = ev(d.value)
              } catch {
                d.value = 'Hata';
                setTimeout(() => d.value = '0', 900)
              }
            } else d.value = (d.value == '0' && /\d/.test(k)) ? k : d.value + k
          };
          g.append(x)
        })
      }
    };
    A.term = {
      t: 'Terminal',
      i: '⌨️',
      w: 640,
      h: 400,
      run(b) {
        b.style.cssText += ';font-family:monospace;padding:8px';
        b.innerHTML = '<div class=o style="flex:1;white-space:pre-wrap;overflow:auto"></div><div class=row style="padding:0"><span>kuduko@os:~$</span><input class=i style="flex:1;border:0;background:transparent"></div>';
        const o = $('.o', b),
          i = $('.i', b),
          p = t => {
            o.textContent += t + '\n';
            o.scrollTop = o.scrollHeight
          };
        p('Kuduko OS terminal. Yardım için: help');
        const C = {
          help: () => 'help clear date echo whoami ls apps open <uygulama> calc <ifade> neofetch',
          date: () => new Date().toString(),
          echo: a => a,
          whoami: () => 'kuduko',
          ls: () => Object.keys(S.g('notes', {})).join('  ') || '(boş)',
          apps: () => Object.keys(A).join(' '),
          open: a => A[a] ? (openApp(a), a + ' açıldı') : 'uygulama yok',
          calc: a => {
            try {
              return ev(a)
            } catch {
              return 'hata'
            }
          },
          neofetch: () => `Kuduko OS 3.0\nTarayıcı: ${navigator.userAgent.slice(0,60)}\nÇekirdek: ${navigator.hardwareConcurrency}\nEkran: ${screen.width}x${screen.height}`
        };
        i.onkeydown = e => {
          if (e.key != 'Enter') return;
          const v = i.value.trim();
          i.value = '';
          p('$ ' + v);
          const [c, ...r] = v.split(' ');
          if (c == 'clear') o.textContent = '';
          else if (C[c]) p(C[c](r.join(' ')));
          else if (v) p('bulunamadı: ' + c)
        };
        i.focus()
      }
    };
    A.browser = {
      t: 'Tarayıcı',
      i: '🌐',
      w: 900,
      h: 580,
      run(b) {
        b.innerHTML = '<div class=row><button class=bk>◀</button><button class=fw>▶</button><button class=rl>⟳</button><input class=u style="flex:1;min-width:120px" placeholder="Adres yazın veya arayın"><button class=go>Git</button><button class=nt title="Yeni sekmede aç">↗</button></div><iframe class=fr style="flex:1;width:100%;border:0;background:#fff" referrerpolicy="no-referrer"></iframe><div class=mut>Not: Google, YouTube gibi bazı siteler iframe içinde açılmayı engeller; ↗ ile yeni sekmede açın. Arama Vikipedi üzerinden yapılır.</div>';
        const u = $('.u', b),
          f = $('.fr', b);
        let H = [],
          x = -1;
        const url = v => {
          v = v.trim();
          return /^https?:\/\//i.test(v) ? v : /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v) ? 'https://' + v : 'https://tr.wikipedia.org/w/index.php?search=' + encodeURIComponent(v)
        };
        const load = a => {
            u.value = a;
            f.src = a
          },
          go = v => {
            if (!v.trim()) return;
            const a = url(v);
            H = H.slice(0, x + 1);
            H.push(a);
            x++;
            load(a)
          };
        $('.go', b).onclick = () => go(u.value);
        u.onkeydown = e => {
          if (e.key == 'Enter') go(u.value)
        };
        $('.bk', b).onclick = () => {
          if (x > 0) load(H[--x])
        };
        $('.fw', b).onclick = () => {
          if (x < H.length - 1) load(H[++x])
        };
        $('.rl', b).onclick = () => {
          f.src = f.src
        };
        $('.nt', b).onclick = () => u.value && window.open(url(u.value), '_blank', 'noopener');
        go('https://tr.wikipedia.org')
      }
    };
    A.paint = {
      t: 'Paint',
      i: '🎨',
      w: 720,
      h: 520,
      run(b) {
        b.innerHTML = '<div class=row><input type=color class=c value="#ff5577"><input type=range class=s min=1 max=40 value=5><button class=er>Silgi</button><button class=cl>Temizle</button></div><canvas style="background:#fff;touch-action:none;flex:1;min-height:0"></canvas>';
        const cv = $('canvas', b),
          x = cv.getContext('2d');
        let er = 0,
          dr = 0;
        const fit = () => {
          cv.width = cv.clientWidth || 600;
          cv.height = cv.clientHeight || 380;
          x.fillStyle = '#fff';
          x.fillRect(0, 0, cv.width, cv.height)
        };
        setTimeout(fit, 30);
        const pt = e => {
          const r = cv.getBoundingClientRect();
          return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]
        };
        cv.onpointerdown = e => {
          dr = 1;
          cv.setPointerCapture(e.pointerId);
          x.beginPath();
          x.moveTo(...pt(e))
        };
        cv.onpointermove = e => {
          if (!dr) return;
          x.lineCap = 'round';
          x.lineWidth = $('.s', b).value;
          x.strokeStyle = er ? '#fff' : $('.c', b).value;
          x.lineTo(...pt(e));
          x.stroke()
        };
        cv.onpointerup = () => dr = 0;
        $('.er', b).onclick = e => {
          er = !er;
          e.target.style.background = er ? 'var(--acc)' : ''
        };
        $('.cl', b).onclick = fit
      }
    };
    A.cam = {
      t: 'Kamera',
      i: '📷',
      w: 640,
      h: 480,
      run(b) {
        b.innerHTML = '<video autoplay playsinline muted style="width:100%;flex:1;min-height:0;object-fit:cover;background:#000"></video><div class=mut>Kamera izni isteniyor...</div>';
        let st, dead = 0;
        navigator.mediaDevices?.getUserMedia({
          video: true
        }).then(s => {
          if (dead) return s.getTracks().forEach(t => t.stop());
          st = s;
          $('video', b).srcObject = s;
          $('.mut', b).textContent = 'Kamera açık'
        }).catch(e => $('.mut', b).textContent = 'Kamera açılamadı: ' + e.message);
        return () => {
          dead = 1;
          st?.getTracks().forEach(t => t.stop())
        }
      }
    };
    A.rec = {
      t: 'Ses Kaydı',
      i: '🎙️',
      w: 420,
      h: 380,
      run(b) {
        b.innerHTML = '<div class=row><button class=st>● Kaydı başlat</button><span class=mut></span></div><div class=m></div>';
        let mr, ch = [],
          stm;
        const st = $('.st', b),
          inf = $('.mut', b),
          l = $('.m', b);
        st.onclick = async () => {
          if (mr && mr.state == 'recording') {
            mr.stop();
            return
          }
          try {
            stm = await navigator.mediaDevices.getUserMedia({
              audio: true
            });
            mr = new MediaRecorder(stm);
            ch = [];
            mr.ondataavailable = e => ch.push(e.data);
            mr.onstop = () => {
              stm.getTracks().forEach(t => t.stop());
              const a = document.createElement('audio');
              a.controls = 1;
              a.style.cssText = 'width:100%;margin:6px 0';
              a.src = URL.createObjectURL(new Blob(ch, {
                type: mr.mimeType
              }));
              l.prepend(a);
              st.textContent = '● Kaydı başlat';
              inf.textContent = ''
            };
            mr.start();
            st.textContent = '■ Durdur';
            inf.textContent = 'Kayıt yapılıyor...'
          } catch (e) {
            inf.textContent = 'Mikrofon açılamadı: ' + e.message
          }
        };
        return () => {
          if (mr && mr.state == 'recording') mr.stop()
        }
      }
    };
    A.player = {
      t: 'Müzik Çalar',
      i: '🎵',
      w: 560,
      h: 330,
      run(b) {
        let ac;
        const F = {
          C: 261.63,
          'C#': 277.18,
          D: 293.66,
          'D#': 311.13,
          E: 329.63,
          F: 349.23,
          'F#': 369.99,
          G: 392,
          'G#': 415.3,
          A: 440,
          'A#': 466.16,
          B: 493.88,
          C2: 523.25
        };
        const play = f => {
          ac = ac || new(window.AudioContext || window.webkitAudioContext)();
          const o = ac.createOscillator(),
            g = ac.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(.4, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + 1.2);
          o.connect(g).connect(ac.destination);
          o.start();
          o.stop(ac.currentTime + 1.2)
        };
        b.innerHTML = '<div class=row><button class=mel>▶ Melodi çal</button><span class=mut>Tuşlara tıkla ya da A S D F G H J K tuşlarını kullan</span></div><div class=k></div>';
        const k = $('.k', b);
        Object.keys(F).forEach(n => {
          const x = document.createElement('button');
          x.textContent = n.length > 2 || n.includes('#') ? '' : n;
          if (n.includes('#')) x.className = 'bk';
          x.onpointerdown = () => play(F[n]);
          k.append(x)
        });

          const x = e.target.dataset.x,
            k = e.target.closest('[data-k]'),
            n = e.target.dataset.n;
          if (x != null) {
            if (T.length > 1) {
              T.splice(+x, 1);
              c = Math.min(c, T.length - 1)
            } else T = [{
              h: [],
              i: -1
            }], c = 0;
            show()
          } else if (n) {
            T.push({
              h: [],
              i: -1
            });
            c = T.length - 1;
            show()
          } else if (k) {
            c = +k.dataset.k;
            show()
          }
        };
        show()
      }
    };
    /* ---- Bluetooth (Web Bluetooth / BLE) ---- */
    IC.bt = '<path d="m7 7 10 10-5 5V2l5 5L7 17"/>';
    const SVN = {
      6144: 'Genel Erişim',
      6145: 'Genel Öznitelik',
      6154: 'Cihaz Bilgisi',
      6159: 'Pil',
      6157: 'Kalp Ritmi',
      6162: 'HID (giriş cihazı)',
      6166: 'Bisiklet Hız/Kadans',
      6168: 'Bisiklet Gücü',
      6170: 'Çevresel Algılama',
      6153: 'Termometre',
      6160: 'Kan Basıncı',
      6164: 'Koşu Hızı',
      6172: 'Kullanıcı Verisi',
      6173: 'Tartı',
      6178: 'Nabız Oksimetre',
      6182: 'Fitness Makinesi',
      6147: 'Acil Durum',
      6148: 'Anlık Zaman',
      6149: 'Sıcaklık Alarmı',
      6152: 'Yakınlık'
    };
    const BTD = new Map(),
      BTL = [];
    let BTU = () => {};
    const btC = () => [...BTD.values()].filter(o => o.dev.gatt && o.dev.gatt.connected).length,
      BTs = () => !navigator.bluetooth ? 'Desteklenmiyor' : btC() ? btC() + ' bağlı' : 'Hazır';
    const bti = mk(svg(IC.bt), 'sy');
    bti.style.display = 'none';
    sy.prepend(bti);
    const btlog = t => {
      BTL.unshift(new Date().toLocaleTimeString('tr-TR') + '  ' + t);
      BTL.length = Math.min(BTL.length, 60);
      const n = btC();
      bti.style.display = n ? 'flex' : 'none';
      bti.title = n + ' Bluetooth cihazı bağlı';
      BTU()
    };
    const dn = d => d.name || ('Adsız ' + d.id.slice(0, 5));

    function btAdd(d) {
      let o = BTD.get(d.id);
      if (!o) {
        o = {
          dev: d,
          bat: null,
          rssi: null,
          info: {},
          auto: false
        };
        BTD.set(d.id, o);
        d.addEventListener('gattserverdisconnected', () => {
          o.bat = null;
          btlog(dn(d) + ' bağlantısı koptu');
          if (o.auto) setTimeout(() => btConn(d.id), 3000)
        });
        d.addEventListener('advertisementreceived', e => {
          o.rssi = e.rssi;
          BTU()
        })
      }
      return o
    }
    async function btRead(o) {
      try {
        const c = await (await o.srv.getPrimaryService(0x180f)).getCharacteristic(0x2a19);
        o.bat = (await c.readValue()).getUint8(0);
        try {
          await c.startNotifications();
          c.addEventListener('characteristicvaluechanged', e => {
            o.bat = e.target.value.getUint8(0);
            BTU()
          })
        } catch {}
      } catch {}
      try {
        const s = await o.srv.getPrimaryService(0x180a);
        for (const [k, u] of [
            ['Üretici', 0x2a29],
            ['Model', 0x2a24],
            ['Yazılım', 0x2a28]
          ]) try {
          o.info[k] = new TextDecoder().decode(await (await s.getCharacteristic(u)).readValue())
        } catch {}
      } catch {}
    }
    async function btConn(id) {
      const o = BTD.get(id);
      if (!o) return;
      const d = o.dev;
      try {
        btlog('Bağlanılıyor: ' + dn(d));
        o.srv = await d.gatt.connect();
        btlog('Bağlandı: ' + dn(d));
        await btRead(o);
        try {
          if (d.watchAdvertisements) d.watchAdvertisements().catch(() => {})
        } catch {}
      } catch (e) {
        btlog('Bağlantı hatası (' + dn(d) + '): ' + e.message)
      }
      btlog('Durum güncellendi')
    }
    A.bt = {
      t: 'Bluetooth',
      w: 780,
      h: 620,
      i: `<span class=tl style="background:linear-gradient(145deg,#38bdf8,#1d4ed8)">${svg(IC.bt)}</span>`,
      run(b) {
        b.innerHTML = '<div class=row><b class=stt style="flex:1"></b><button class=ad>Cihaz ekle</button><button class=gd>Kayıtlı cihazlar</button><button class=ca>Tümünü bağla</button></div><div class=lst style="overflow:auto;max-height:240px"></div><div class=det style="flex:1;overflow:auto;padding:8px;border-top:1px solid var(--bd)"><div class=mut>Bağlı bir cihazda "Servisler" düğmesine basarak okuma, yazma ve bildirimleri kontrol edin.</div></div><div class="lg mut" style="height:96px;overflow:auto;padding:6px 10px;border-top:1px solid var(--bd);font-size:12px"></div>';
        const q = s => $(s, b),
          lst = q('.lst'),
          det = q('.det'),
          lg = q('.lg'),
          stt = q('.stt'),
          pol = document.permissionsPolicy || document.featurePolicy,
          okp = !pol || !pol.allowsFeature || pol.allowsFeature('bluetooth');
        (async () => {
          stt.textContent = !navigator.bluetooth ? 'Bu tarayıcı Web Bluetooth desteklemiyor (Chrome/Edge kullanın)' : !okp ? 'Gömülü görünümde Bluetooth izni kapalı' : await navigator.bluetooth.getAvailability().then(a => a ? 'Bluetooth kullanılabilir' : 'Bluetooth adaptörü yok ya da kapalı').catch(() => 'Durum alınamadı')
        })();
        const err = e => btlog('Hata: ' + (e.name == 'SecurityError' ? 'bu görünümde Bluetooth izni yok, sayfayı doğrudan Chrome/Edge sekmesinde açın' : e.name == 'NotFoundError' ? 'cihaz seçilmedi' : e.message));
        const r = () => {
          lst.innerHTML = [...BTD.values()].map(o => {
            const d = o.dev,
              on = d.gatt && d.gatt.connected;
            return `<div class=row style="border:1px solid var(--bd);border-radius:10px;margin:6px 8px"><div style="flex:1;min-width:150px"><b>${esc(dn(d))}</b><div class=mut style="font-size:12px">${on?'● Bağlı':'○ Bağlı değil'}${o.bat!=null?' · Pil %'+o.bat:''}${o.rssi!=null?' · '+o.rssi+' dBm':''}${o.info['Üretici']?' · '+esc(o.info['Üretici']):''}${o.info['Model']?' · '+esc(o.info['Model']):''}</div></div><button data-c="${d.id}">${on?'Kes':'Bağlan'}</button><button data-s="${d.id}" ${on?'':'disabled'}>Servisler</button><label class=mut><input type=checkbox data-a="${d.id}" ${o.auto?'checked':''}> otomatik</label><button data-f="${d.id}">Unut</button></div>`
          }).join('') || '<div class=mut style="padding:12px">Henüz cihaz yok. "Cihaz ekle" ile çevredeki cihazları tarayın.</div>';
          lg.innerHTML = BTL.map(esc).join('<br>');
          bt(lst.querySelectorAll('[data-c]'), x => {
            const o = BTD.get(x.dataset.c);
            o.dev.gatt.connected ? (o.auto = false, o.dev.gatt.disconnect()) : btConn(x.dataset.c)
          });
          bt(lst.querySelectorAll('[data-s]'), x => expl(BTD.get(x.dataset.s)));
          lst.querySelectorAll('[data-a]').forEach(x => x.onchange = () => BTD.get(x.dataset.a).auto = x.checked);
          bt(lst.querySelectorAll('[data-f]'), x => {
            const o = BTD.get(x.dataset.f);
            try {
              o.dev.gatt.disconnect();
              o.dev.forget && o.dev.forget()
            } catch {}
            BTD.delete(x.dataset.f);
            btlog('Cihaz kaldırıldı');
            r()
          })
        };
        const expl = async o => {
          det.textContent = 'Servisler okunuyor...';
          try {
            const ss = await o.srv.getPrimaryServices();
            det.innerHTML = '';
            for (const s of ss) {
              const n = SVN[parseInt(s.uuid.slice(4, 8), 16)] || s.uuid;
              det.append(mk(`<b>${esc(n)}</b> <span class=mut>${s.uuid.slice(0,8)}</span>`, 'row'));
              let cs = [];
              try {
                cs = await s.getCharacteristics()
              } catch {}
              for (const c of cs) {
                const p = c.properties,
                  w = mk(`<span class=mut style="flex:1;font-size:12px">${c.uuid.slice(0,8)} · ${['read','write','notify'].filter(k=>p[k]).join('/')}</span><span class=val style="font-size:12px"></span>`, 'row'),
                  v = $('.val', w),
                  sh = dv => {
                    const a = [...new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength)];
                    v.textContent = a.map(x => x.toString(16).padStart(2, '0')).join(' ') + ' | ' + (c.uuid.startsWith('00002a37') && a.length > 1 ? 'nabız ' + (a[0] & 1 ? dv.getUint16(1, true) : a[1]) : new TextDecoder().decode(dv).replace(/[^\x20-\x7e]/g, '.'))
                  };
                const mb = (t, f) => {
                  const x = document.createElement('button');
                  x.textContent = t;
                  x.onclick = () => f(x).catch(e => v.textContent = e.message);
                  w.append(x)
                };
                if (p.read) mb('Oku', async () => sh(await c.readValue()));
                if (p.notify) mb('Bildirim', async x => {
                  await c.startNotifications();
                  c.addEventListener('characteristicvaluechanged', e => sh(e.target.value));
                  x.textContent = 'İzleniyor'
                });
                if (p.write || p.writeWithoutResponse) {
                  const i = document.createElement('input');
                  i.placeholder = 'hex: 01 ff';
                  i.style.width = '90px';
                  w.append(i);
                  mb('Yaz', async () => {
                    const a = Uint8Array.from(i.value.trim().split(/\s+/).map(h => parseInt(h, 16)));
                    p.write ? await c.writeValue(a) : await c.writeValueWithoutResponse(a);
                    v.textContent = 'yazıldı';
                    btlog('Veri yazıldı: ' + i.value)
                  })
                }
                det.append(w)
              }
            }
          } catch (e) {
            det.textContent = 'Hata: ' + e.message
          }
        };
        q('.ad').onclick = async () => {
          try {
            const d = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: Object.keys(SVN).map(Number)
            });
            btAdd(d);
            btlog('Cihaz eklendi: ' + dn(d));
            btConn(d.id)
          } catch (e) {
            err(e)
          }
        };
        q('.gd').onclick = async () => {
          try {
            if (!navigator.bluetooth.getDevices) throw Error('getDevices bu tarayıcıda yok');
            const ds = await navigator.bluetooth.getDevices();
            ds.forEach(btAdd);
            btlog(ds.length + ' kayıtlı cihaz bulundu')
          } catch (e) {
            err(e)
          }
        };
        q('.ca').onclick = () => [...BTD.values()].forEach(o => {
          if (!(o.dev.gatt && o.dev.gatt.connected)) btConn(o.dev.id)
        });
        BTU = r;
        r();
        const t = setInterval(r, 5000);
        return () => {
          clearInterval(t);
          BTU = () => {}
        }
      }
    };
    /* ---- Wi-Fi paneli (Windows tarzı) — not: tarayıcılar gerçek Wi-Fi donanımına erişemez, bu görsel bir simülasyondur ---- */
    IC.lock = '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
    const WIFI_NET = [
      ['Ev-WiFi', 0],
      ['TurkTelekom_5423', 1],
      ['Vodafone-9F21', 1],
      ['Superonline_A1B2', 1],
      ['Komsu_Modemi', 1],
      ['iPhone-Ahmet', 1],
      ['TP-LINK_2.4G', 1],
      ['ASUS_RT-5G', 1],
      ['Misafir-WiFi', 0],
      ['Starbucks Free WiFi', 0],
      ['Cafe-Net', 0]
    ];
    const wifiBars = s => {
      let r = '';
      for (let i = 0; i < 4; i++) {
        const h = 4 + i * 4;
        r += `<rect x="${i*5}" y="${16-h}" width="3.5" height="${h}" rx="1" fill="currentColor" opacity="${s>i?1:.25}"/>`
      }
      return `<svg viewBox="0 0 20 16" width="20" height="16">${r}</svg>`
    };
    A.wifi = {
      t: 'Wi-Fi',
      w: 380,
      h: 520,
      i: `<span class=tl style="background:linear-gradient(145deg,#60a5fa,#2563eb)">${svg(IC.wifi)}</span>`,
      run(b) {
        b.innerHTML = '<div class=row style="justify-content:space-between"><b>Wi-Fi ağları</b><button class=rf title="Yenile">⟳ Tara</button></div><div class=lst style="flex:1;overflow:auto"></div><div class=mut style="padding:8px;font-size:11px">Not: Tarayıcılar güvenlik nedeniyle gerçek Wi-Fi donanımına erişemez; bu panel Windows tarzı görsel bir simülasyondur.</div>';
        const q = s => $(s, b),
          lst = q('.lst');
        let nets = [];
        const scan = () => {
          const sh = [...WIFI_NET].sort(() => Math.random() - .5);
          nets = sh.slice(0, 5 + Math.floor(Math.random() * 4)).map(([name, lock]) => ({
            name,
            lock,
            sig: 1 + Math.floor(Math.random() * 4)
          }));
          const conn = S.g('wifiConn', null);
          if (conn && !nets.some(n => n.name == conn)) nets.unshift({
            name: conn,
            lock: 1,
            sig: 4
          });
          r()
        };
        const connect = async (net, pass) => {
          S.s('wifiBusy', net.name);
          r();
          await new Promise(res => setTimeout(res, 900));
          S.s('wifiConn', net.name);
          if (pass != null) {
            const k = S.g('wifiKnown', {});
            k[net.name] = pass;
            S.s('wifiKnown', k)
          }
          S.s('wifiBusy', 0);
          r();
          toast('"' + net.name + '" ağına bağlanıldı (simüle)')
        };
        const disconnect = () => {
          S.s('wifiConn', null);
          r();
          toast('Wi-Fi bağlantısı kesildi')
        };
        const r = () => {
          const conn = S.g('wifiConn', null),
            busy = S.g('wifiBusy', 0),
            known = S.g('wifiKnown', {});
          lst.innerHTML = nets.map(n => {
            const isConn = n.name == conn,
              isBusy = busy == n.name;
            return `<div class=row style="justify-content:space-between;border-radius:10px;${isConn?'background:#3b82f62e':''}"><span style="display:flex;align-items:center;gap:8px">${wifiBars(n.sig)}${n.lock?svg(IC.lock):''}<span>${esc(n.name)}</span></span>${isConn?'<button data-dc>Bağlantıyı Kes</button>':`<button data-c="${esc(n.name)}" ${busy?'disabled':''}>${isBusy?'Bağlanıyor...':'Bağlan'}</button>`}</div>`
          }).join('') || '<div class=mut style="padding:10px">Yakında ağ bulunamadı.</div>';
          lst.querySelectorAll('[data-dc]').forEach(x => x.onclick = disconnect);
          lst.querySelectorAll('[data-c]').forEach(x => x.onclick = () => {
            const net = nets.find(n => n.name == x.dataset.c);
            if (!net) return;
            if (net.lock && !known[net.name]) {
              const p = prompt('"' + net.name + '" için ağ güvenlik anahtarını girin:');
              if (p == null) return;
              connect(net, p)
            } else connect(net, known[net.name] ?? null)
          })
        };
        q('.rf').onclick = scan;
        scan();
        const t = setInterval(() => {
          if (!S.g('wifiBusy', 0)) nets.forEach(n => {
            if (n.name != S.g('wifiConn', null)) n.sig = Math.max(1, Math.min(4, n.sig + (Math.random() < .5 ? -1 : 1)))
          });
          r()
        }, 4000);
        return () => clearInterval(t)
      }
    };
    rebuild();
    tbr();
    if (S.g('sess', 0) == 1) boot();
  </script>
</body>

</html>
